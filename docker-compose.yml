name: lab4-gateway-borde

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    container_name: lab4-gw-keycloak
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8082
    command:
      - start-dev
      - --import-realm
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./realm:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        - "CMD-SHELL"
        - "timeout 3 bash -c 'exec 3<>/dev/tcp/localhost/9000 && echo -e \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3' | grep -q '200 OK'"
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  whoami:
    image: traefik/whoami:v1.10
    container_name: lab4-gw-whoami
    restart: unless-stopped

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
    container_name: lab4-gw-oauth2-proxy
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      keycloak:
        condition: service_healthy
    ports:
      - "8082:4180"
    command:
      - --provider=keycloak-oidc
      - --http-address=0.0.0.0:4180
      - --oidc-issuer-url=http://localhost:8082/realms/curso
      - --skip-oidc-discovery=true
      - --login-url=http://localhost:8082/realms/curso/protocol/openid-connect/auth
      - --redeem-url=http://keycloak:8080/realms/curso/protocol/openid-connect/token
      - --oidc-jwks-url=http://keycloak:8080/realms/curso/protocol/openid-connect/certs
      - --profile-url=http://keycloak:8080/realms/curso/protocol/openid-connect/userinfo
      - --client-id=gateway
      - --redirect-url=http://localhost:8082/oauth2/callback
      - --upstream=http://whoami:80/
      - --upstream=http://keycloak:8080/realms/
      - --upstream=http://keycloak:8080/resources/
      - --upstream=http://keycloak:8080/admin/
      - --skip-auth-route=^/realms/.*
      - --skip-auth-route=^/resources/.*
      - --skip-auth-route=^/admin/.*
      - --email-domain=*
      - --pass-access-token=true
      - --set-xauthrequest=true
      - --skip-provider-button=true
      - --cookie-secure=false

volumes:
  keycloak_data:
